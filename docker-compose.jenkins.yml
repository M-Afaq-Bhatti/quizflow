version: '3.8'
services:
# MongoDB — with persistent volume
mongo-ci:
image: mongo:6.0
container_name: quizflow-ci-mongo
restart: unless-stopped
ports:
- "27018:27017"
volumes:
- mongo_ci_data:/data/db
networks:
- quizflow-ci-network
# Backend — code mounted as volume (no Dockerfile needed)
backend-ci:
image: node:18-alpine
container_name: quizflow-ci-backend
restart: unless-stopped
QuizFlow — Part II: Jenkins CI/CD Pipeline on AWS EC2 Page 11
Assignment Part II | Jenkins + Docker + GitHub Webhook | Frontend: 3001 | Backend: 5001
working_dir: /app
volumes:
- ./backend:/app
- /app/node_modules
ports:
- "5001:5000"
environment:
- PORT=5000
- MONGO_URI=mongodb://mongo-ci:27017/quizflow
- JWT_SECRET=jenkins_ci_secret_key_123
command: sh -c "npm install && node server.js"
depends_on:
- mongo-ci
networks:
- quizflow-ci-network
# Frontend — code mounted as volume (no Dockerfile needed)
frontend-ci:
image: node:18-alpine
container_name: quizflow-ci-frontend
restart: unless-stopped
working_dir: /app
volumes:
- ./frontend:/app
- /app/node_modules
ports:
- "3001:3000"
environment:
- REACT_APP_API_URL=http://YOUR_EC2_PUBLIC_IP:5001
command: sh -c "npm install && npm start"
depends_on:
- backend-ci
networks:
- quizflow-ci-network
volumes:
mongo_ci_data:
driver: local
networks:
quizflow-ci-network:
driver: bridge
