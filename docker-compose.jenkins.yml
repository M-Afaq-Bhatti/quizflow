version: '3.8'

services:

  mongo-ci:
    image: mongo:6.0
    container_name: quizflow-ci-mongo
    restart: unless-stopped
    ports:
      - "27018:27017"
    volumes:
      - mongo_ci_data:/data/db
    networks:
      - quizflow-ci-network

  backend-ci:
    image: node:18-alpine
    container_name: quizflow-ci-backend
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./backend:/app
      - /app/node_modules
    ports:
      - "5001:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongo-ci:27017/quizflow
      - JWT_SECRET=quizflow_super_secret_key_2024
    command: sh -c "npm install && node server.js"
    depends_on:
      - mongo-ci
    networks:
      - quizflow-ci-network

  frontend-ci:
    image: node:18-alpine
    container_name: quizflow-ci-frontend
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3001:3000"
    environment:
      - REACT_APP_API_URL=http://98.93.199.196:5001
    command: sh -c "npm install && npm start"
    depends_on:
      - backend-ci
    networks:
      - quizflow-ci-network

volumes:
  mongo_ci_data:
    driver: local

networks:
  quizflow-ci-network:
    driver: bridge
